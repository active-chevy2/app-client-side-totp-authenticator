<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live codes from your Bitwarden Authenticator exports">
    <meta name="theme-color" content="#FFFBFE">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="2FA Authenticator">
    <title>2FA Authenticator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <!-- Applies the saved colour theme before the page is painted. Keep it in <head>. -->
    <script src="theme.js"></script>
    <!-- Sets the title, description and logo from config.json. -->
    <script src="app-config.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <img id="app-logo" class="app-logo" alt="" hidden>
                <div class="title-block">
                    <h1 id="app-title">2FA Authenticator</h1>
                    <p id="app-description" class="subtitle">Live codes from your Bitwarden Authenticator exports</p>
                </div>
            </div>
            <div class="theme-switch" role="group" aria-label="Colour theme">
                <button type="button" class="theme-option" data-theme-value="auto" aria-pressed="true">Auto</button>
                <button type="button" class="theme-option" data-theme-value="light" aria-pressed="false">Light</button>
                <button type="button" class="theme-option" data-theme-value="dark" aria-pressed="false">Dark</button>
            </div>
        </header>

        <main>
            <section>
                <h2>Load your export</h2>
                <label class="file-button">
                    <input type="file" id="file-input" accept=".json,.csv" multiple>
                    <span>Choose .json or .csv file(s)</span>
                </label>
                <p class="hint">Export from the Bitwarden Authenticator app (Android). Files stay in your browser.</p>
                <div id="message" class="message" hidden></div>
            </section>

            <section id="controls" class="controls" hidden>
                <input type="text" id="search-input" placeholder="Search by name or account" aria-label="Search accounts">
                <span class="stats">Accounts: <strong id="total-count">0</strong></span>
            </section>

            <section id="cards-section" hidden>
                <div id="cards" class="cards"></div>
            </section>

            <section id="empty-state" class="empty" hidden>
                <p>No 2FA codes loaded yet.</p>
            </section>
        </main>

        <footer>
            <p>Everything runs in your browser. No data is uploaded.</p>
        </footer>
    </div>

    <script src="vendor/crypto-js.js"></script>
    <script src="parser.js"></script>
    <script src="totp.js"></script>
    <script src="app.js"></script>
</body>
</html>
