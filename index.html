<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Authenticator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>2FA Authenticator</h1>
            <p class="subtitle">Live codes from your Bitwarden Authenticator exports</p>
        </header>

        <main>
            <section>
                <h2>Load your export</h2>
                <label for="file-input" class="file-button">Choose .json or .csv file(s)</label>
                <input type="file" id="file-input" accept=".json,.csv" multiple>
                <p class="hint">Export from the Bitwarden Authenticator app (Android). Files stay in your browser.</p>
                <div id="message" class="message" hidden></div>
            </section>

            <section id="controls" class="controls" hidden>
                <input type="text" id="search-input" placeholder="Search by name or account">
                <span class="stats">Accounts: <strong id="total-count">0</strong></span>
            </section>

            <section id="cards-section" hidden>
                <div id="cards" class="cards"></div>
            </section>

            <section id="empty-state" class="empty" hidden>
                <p>No 2FA codes loaded yet.</p>
            </section>
        </main>

        <footer>
            <p>Everything runs in your browser. No data is uploaded.</p>
        </footer>
    </div>

    <script src="vendor/crypto-js.js"></script>
    <script src="parser.js"></script>
    <script src="totp.js"></script>
    <script src="app.js"></script>
</body>
</html>
