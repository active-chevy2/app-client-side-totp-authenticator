server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Make sure browsers receive bundled fonts with the correct type
    location ~* \.woff2$ {
        types { font/woff2 woff2; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none';" always;
}
