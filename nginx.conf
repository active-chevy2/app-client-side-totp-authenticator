server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct types for the bundled font and the web app manifest
    location ~* \.woff2$ {
        types { font/woff2 woff2; }
    }

    location ~* \.webmanifest$ {
        types { application/manifest+json webmanifest; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self';" always;
}
